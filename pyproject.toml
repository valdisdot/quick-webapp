[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quick-web-app"
version = "1.0.0"
description = "Mini framework to build ready-to-use Streamlit webapp."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "streamlit==1.58.0",
    "pandas",
    "openpyxl",
    "bcrypt"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]