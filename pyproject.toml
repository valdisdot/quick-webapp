[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quick_webapp"
version = "1.0.0"
description = "Mini framework to build ready-to-use Streamlit webapp."
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "streamlit>=1.63.0",
    "pandas",
    "openpyxl",
    "bcrypt",
    "genson"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]